*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:#C40000;color:#fff;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#FF2A2A 0%,#D50000 45%,#8E0000 100%)}
.bg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 18%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 18%,#000,transparent 70%)}
.ring{position:absolute;top:110px;left:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(255,255,255,.5);border-radius:50%;animation:radar 4.5s ease-out infinite}
.ring:nth-child(2){animation-delay:1.5s}.ring:nth-child(3){animation-delay:3s}
@keyframes radar{from{transform:scale(.3);opacity:.9}to{transform:scale(5);opacity:0}}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:fl 9s ease-in-out infinite alternate}
.b1{width:240px;height:240px;background:#ff6b6b;top:40%;right:-80px}.b2{width:260px;height:260px;background:#6e0000;bottom:-60px;left:-90px;animation-delay:-4s}
@keyframes fl{to{transform:translate(-30px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 16px 40px}
.logo{display:flex;align-items:center;gap:12px}
.pin{width:60px;height:60px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-5deg)}}
h1{margin:0;font-size:38px;font-weight:900;text-shadow:0 3px 12px rgba(0,0,0,.3);background:linear-gradient(180deg,#fff,#ffd9d9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin:8px 2px 18px;font-size:16px;opacity:.95}
.loc{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;font-size:14px;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#ffd54f;flex:none;animation:pulse 1.4s infinite}
.dot.ok{background:#69f0ae;--c:105,240,174}.dot.bad{background:#fff;animation:none}
.dot{--c:255,213,79}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--c),.7)}100%{box-shadow:0 0 0 12px rgba(var(--c),0)}}
.rip{position:relative;overflow:hidden;cursor:pointer;font-family:inherit;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.rip:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.rip:active{transform:scale(.9) translateY(1px)}
.rip.sq{animation:squish .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes squish{30%{transform:scale(.88,1.1)}60%{transform:scale(1.1,.92)}100%{transform:none}}
.bt{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:9;animation:bst .7s ease-out forwards}
@keyframes bst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
#go{animation:glow 2.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,42,42,.7)}50%{box-shadow:0 0 0 12px rgba(255,42,42,0)}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fp{position:absolute;bottom:-50px;opacity:0;animation:fup linear infinite}
.fp svg{width:100%;height:100%}
@keyframes fup{10%{opacity:.4}to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.mapb{width:100%;height:120px;border-radius:18px;display:block;margin-bottom:14px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio a{padding:13px 4px!important;font-size:13.5px!important}
.btns a.big{font-size:18px;padding:18px}
.big:after{content:"←";margin-inline-start:10px;display:inline-block;animation:ar 1s ease-in-out infinite}
@keyframes ar{50%{transform:translateX(-7px)}}
.acc{font-size:12px;color:var(--mut);text-align:center}
.rip i{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.rip.dk i{background:rgba(213,0,0,.28)}
@keyframes rp{to{transform:scale(1);opacity:0}}
.loc button{margin-inline-start:auto;border:0;background:#fff;color:var(--red);font-weight:800;border-radius:999px;padding:6px 14px;font-size:13px}
.search{display:flex;align-items:center;background:#fff;border-radius:22px;padding:6px;box-shadow:0 16px 36px rgba(0,0,0,.4);transition:box-shadow .25s,transform .25s}
.search:focus-within{transform:translateY(-3px) scale(1.01);box-shadow:0 22px 44px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.35)}
.search svg{margin:0 12px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:13px 0;color:var(--ink);font-family:inherit}
.search input::placeholder{color:#a0a0a6}
#go{border:0;background:linear-gradient(135deg,#FF2A2A,#B00000);color:#fff;font-weight:800;font-size:16px;border-radius:16px;padding:14px 24px}
#go:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.sec{margin:26px 4px 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.5),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:#fff;color:var(--ink);border:0;border-radius:22px;padding:0;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.32);animation:in .55s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
.tile:hover{transform:translateY(-6px);box-shadow:0 20px 36px rgba(0,0,0,.4)}
.tile .art{height:104px;display:grid;place-items:center;position:relative;overflow:hidden}
.tile .art:before{content:"";position:absolute;width:150%;height:150%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 55%);top:-60%;left:-20%}
.tile .art svg{width:84px;height:84px;position:relative;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tile .art svg{transform:translate(var(--tx,0px),var(--ty,0px))}
.tile:hover .art svg{transform:translate(var(--tx,0px),var(--ty,0px)) scale(1.2) rotate(-6deg)}
.tile b{display:block;padding:11px 6px 13px;font-size:15px;font-weight:800}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.9)}to{opacity:1;transform:none}}
.res{display:none;background:#fff;color:var(--ink);border-radius:26px;padding:20px;margin-top:24px;box-shadow:0 22px 50px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.res .top{display:flex;align-items:center;gap:14px}
.res .ic{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#546E7A,#263238)}
.res .ic svg{width:70px;height:70px;animation:bob 2.6s ease-in-out infinite}
.res h2{margin:0 0 4px;font-size:23px;font-weight:900;color:var(--red)}
.res p{margin:0;color:var(--mut);font-size:14px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btns a{display:block;text-align:center;text-decoration:none;padding:16px;border-radius:16px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#FF2A2A,#B00000);color:#fff;box-shadow:0 8px 18px rgba(176,0,0,.4)}
.btns a.alt{background:#fff;color:var(--red);border:2px solid var(--red);box-shadow:none}
.foot{text-align:center;margin-top:28px;font-size:12px;opacity:.75}
#sp{position:fixed;inset:0;z-index:99;background:#630808;display:grid;place-items:center;animation:spOut .5s 1.7s forwards}
#sp img{width:min(72vw,380px);height:auto;animation:spIn .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700}
.lh{margin:20px 2px 10px;font-weight:900;font-size:17px;color:var(--ink)}
.pl{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid #f0e0e0;border-radius:18px;margin-bottom:12px;background:#fff;animation:sl .5s cubic-bezier(.2,.9,.3,1.2) both;position:relative}
.pl.f{border-color:var(--red);background:linear-gradient(135deg,#fff,#fff0f0);box-shadow:0 8px 20px rgba(213,0,0,.25)}
.pl.f:before{content:"الأقرب";position:absolute;top:-10px;right:14px;background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:2px 10px;border-radius:99px;animation:glow 2s infinite}
@keyframes sl{from{opacity:0;transform:translateX(30px)}}
.rk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small{color:var(--mut);font-size:12px}
.ds{flex:none;font-weight:900;font-size:13px;color:var(--red);background:#ffecec;border-radius:10px;padding:5px 8px}
.pl .go{flex:none;padding:10px 12px!important;font-size:13px!important;border-radius:12px!important;box-shadow:none!important;text-decoration:none;color:#fff;background:linear-gradient(135deg,#FF2A2A,#B00000);font-weight:800}
.msg{margin-top:16px;padding:14px;border-radius:14px;background:#fff4f4;color:var(--mut);font-size:13.5px;text-align:center}
.scan{display:flex;align-items:center;gap:14px;margin-top:18px;color:var(--ink);font-weight:800}
.scan .r{position:relative;width:46px;height:46px;flex:none}
.scan .r i{position:absolute;inset:0;border:3px solid var(--red);border-radius:50%;animation:radar2 1.6s ease-out infinite}
.scan .r i:nth-child(2){animation-delay:.5s}
@keyframes radar2{from{transform:scale(.2);opacity:1}to{transform:scale(1.3);opacity:0}}
.sk{height:58px;border-radius:18px;margin-top:10px;background:linear-gradient(100deg,#f3e6e6 30%,#fff 50%,#f3e6e6 70%);background-size:200% 100%;animation:shm 1.2s infinite}
@keyframes shm{to{background-position:-200% 0}}
.cr{text-align:center;font-size:11px;color:var(--mut);margin-top:6px}
.pl{flex-wrap:wrap}
.ds em{display:block;font-style:normal;font-size:11px;color:#76767c;font-weight:700;margin-top:2px}
.ac{flex-basis:100%;display:flex;gap:8px}
.pl .ac a{flex:1;text-align:center;padding:11px 6px!important}
.go.alt2{background:#fff!important;color:#D50000!important;border:1.5px solid #D50000}
.lh small{font-size:11px;color:#76767c;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1}#sp{display:none}}
</style>
</head>

   var t=e.t,ad=[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ")||t["addr:suburb"]||c.n,
   hrs=t.opening_hours?(t.opening_hours==="24/7"?"شغال 24 ساعة":"ساعات: "+t.opening_hours.slice(0,26)):"",
   eta=e.rr<1200?"مشي "+Math.max(1,Math.ceil(e.rr/75))+" د":(e.rt?"بالعربية "+Math.max(1,Math.ceil(e.rt/60))+" د":""),
   ph=(t.phone||t["contact:phone"]||"").split(";")[0].replace(/[^+\d]/g,""),
   dir='https://www.google.com/maps/dir/?api=1&origin='+pos.lat+','+pos.lng+'&destination='+e.la+','+e.lo+'&travelmode='+(e.rr<1200?"walking":"driving"),
   det='https://www.google.com/maps/search/'+encodeURIComponent(e.n||c.t)+'/@'+e.la+','+e.lo+',19z';
   return '<div class="pl'+(i?'':' f')+'" style="animation-delay:'+i*70+'ms"><span class="rk">'+(i+1)+'</span><div class="pi"><b>'+esc(e.n||c.s)+'</b><small>'+esc(ad)+(hrs?' • '+esc(hrs):'')+'</small></div><span class="ds">'+fmt(e.rr)+'<em>'+eta+'</em></span><div class="ac"><a class="rip go" target="_blank" rel="noopener" href="'+dir+'">اتجاهات</a><a class="rip go alt2" target="_blank" rel="noopener" href="'+det+'">تفاصيل وتقييمات</a>'+(ph?'<a class="rip go alt2" href="tel:'+ph+'">اتصل</a>':'')+'</div></div>'}).join("")+'<div class="cr">المسافة على الطريق من OSRM • البيانات من OpenStreetMap</div>';
 }catch(x){loading=false;shown=true;if(my===tok)L.innerHTML='<div class="msg">القايمة بتظهر جوّه تطبيق الموبايل مع النت. دلوقتي استخدم أزرار الخرائط اللي فوق.</div>'}
}
function mapUrl(t){var b="https://www.google.com/maps/search/"+encodeURIComponent(t);return pos?b+"/@"+pos.lat+","+pos.lng+",16z":b}
function fill(c){var t=c.t;
 $("open").href=mapUrl(t);$("now").href=mapUrl(t+" مفتوح الآن");$("rate").href=mapUrl(t+" الأعلى تقييما");
 $("go2").href="https://www.google.com/maps/dir/?api=1"+(pos?"&origin="+pos.lat+","+pos.lng:"")+"&destination="+encodeURIComponent(t)+"&travelmode=driving";
 $("acc").textContent=pos?"موقعك الحالي بدقة ±"+pos.acc+" متر":"فعّل الموقع علشان نجيب أقرب مكان بدقة"}
function search(){
  var q=$("q").value.trim();if(!q)return;var c=detect(q);c.q=q;var g=$("go");g.innerHTML='<span class="spin"></span>';setTimeout(function(){g.textContent="ابحث"},550);
  $("ic").innerHTML=c.a>=0?ART[c.a]:PIN;
  $("rt").textContent="أقرب "+c.n;
  $("rp").textContent=pos?"مرتّبين حسب القرب من موقعك الحالي.":"اسمح بالموقع الأول علشان النتايج تكون حواليك.";
  cur=c;fill(c);nearby(c);
  var r=$("res");r.style.display="none";void r.offsetWidth;r.style.display="block";
  try{r.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){}
}
document.addEventListener("pointerdown",function(e){
  var b=e.target.closest&&e.target.closest(".rip");if(!b)return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,i=document.createElement("i");
  i.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";
  b.appendChild(i);setTimeout(function(){i.remove()},650);
  for(var k=0;k<8;k++){var s=document.createElement("span"),a=k*Math.PI/4,dd=40+Math.random()*30;s.className="bt";s.style.cssText="left:"+(e.clientX-r.left)+"px;top:"+(e.clientY-r.top)+"px;background:"+(k%2?(b.classList.contains("dk")?"#D50000":"#fff"):"#FFB300")+";--x:"+Math.cos(a)*dd+"px;--y:"+Math.sin(a)*dd+"px";b.appendChild(s);(function(z){setTimeout(function(){z.remove()},700)})(s)}
  b.classList.remove("sq");void b.offsetWidth;b.classList.add("sq");
});
$("go").onclick=search;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")search()});
$("retry").onclick=askLoc;
(function(){var bg=document.querySelector(".bg");for(var i=0;i<12;i++){var d=document.createElement("div"),s=14+Math.random()*22;d.className="fp";d.style.cssText="left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(9+Math.random()*10)+"s;animation-delay:-"+Math.random()*14+"s";d.innerHTML=PIN.replace(/#D50000/,"#fff");bg.appendChild(d)}})();
document.addEventListener("pointermove",function(e){var t=e.target.closest&&e.target.closest(".tile");if(!t)return;var r=t.getBoundingClientRect(),v=t.querySelector("svg");v.style.setProperty("--tx",((e.clientX-r.left)/r.width-.5)*14+"px");v.style.setProperty("--ty",((e.clientY-r.top)/r.height-.5)*10+"px")});
document.addEventListener("pointerout",function(e){var t=e.target.closest&&e.target.closest(".tile");if(t){var v=t.querySelector("svg");v.style.setProperty("--tx","0px");v.style.setProperty("--ty","0px")}});
CATS.slice(0,8).forEach(function(c,i){
  var b=document.createElement("button");b.className="tile rip dk";b.style.animationDelay=(i*70)+"ms";
  b.innerHTML='<div class="art" style="background:linear-gradient(135deg,'+BG[i]+')">'+ART[i]+'</div><b>'+c.s+'</b>';
  b.onclick=function(){$("q").value=c.s;search()};$("grid").appendChild(b);
});
CATS.forEach(function(c){var b=document.createElement("button");b.className="chip rip";b.textContent=c.s;b.onclick=function(){$("q").value=c.s;search()};$("chips").appendChild(b)});
(function(){var a=["أكل","دكتور","أدوات مدرسية","صيدلية","بنزين","حلاق","مسجد","تصوير"],i=0;setInterval(function(){if(document.activeElement!==$("q"))$("q").placeholder="اكتب: "+a[i++%a.length]+"…"},2400)})();
askLoc();
</script>
</body>
</html>
